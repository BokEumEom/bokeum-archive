name: Assemble Gallery Assets

on:
  push:
    branches:
      - feat/mayz-gallery-v2
    paths:
      - '.gallery-atlas-pack/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-gallery-assets
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mayz-gallery-v2
          fetch-depth: 0

      - name: Check package completeness
        id: check
        shell: bash
        run: |
          count=$(find .gallery-atlas-pack -maxdepth 1 -name 'chunk-*.txt' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -lt 14 ]; then
            echo "Waiting for all 14 chunks; found $count"
          fi

      - name: Rebuild gallery atlas
        if: steps.check.outputs.count == '14'
        shell: bash
        run: |
          cat .gallery-atlas-pack/chunk-*.txt > /tmp/gallery-atlas.b64
          base64 -d /tmp/gallery-atlas.b64 > public/assets/gallery-atlas.webp
          test -s public/assets/gallery-atlas.webp
          file public/assets/gallery-atlas.webp
          rm -rf .gallery-atlas-pack

      - name: Commit assembled asset
        if: steps.check.outputs.count == '14'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/assets/gallery-atlas.webp .gallery-atlas-pack
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: assemble high-quality prompt gallery atlas"
          git push origin HEAD:feat/mayz-gallery-v2
