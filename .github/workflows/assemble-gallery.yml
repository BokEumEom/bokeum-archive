name: Assemble Gallery Assets

on:
  push:
    branches:
      - feat/mayz-gallery-v2
    paths:
      - '.gallery-pack/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-gallery-assets
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mayz-gallery-v2
          fetch-depth: 0

      - name: Check package completeness
        id: check
        shell: bash
        run: |
          count=$(find .gallery-pack -maxdepth 1 -name 'chunk-*.txt' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -lt 5 ]; then
            echo "Waiting for all 5 chunks; found $count"
          fi

      - name: Rebuild high-quality gallery assets
        if: steps.check.outputs.count == '5'
        shell: bash
        run: |
          cat .gallery-pack/chunk-*.txt > /tmp/gallery-assets.b64
          base64 -d /tmp/gallery-assets.b64 > /tmp/gallery-assets.tar
          mkdir -p public/assets/gallery
          tar -xf /tmp/gallery-assets.tar -C public/assets/gallery
          test "$(find public/assets/gallery -maxdepth 1 -name '*.webp' | wc -l | tr -d ' ')" = "18"
          rm -rf .gallery-pack

      - name: Commit assembled assets
        if: steps.check.outputs.count == '5'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/assets/gallery .gallery-pack
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: assemble high-quality prompt gallery assets"
          git push origin HEAD:feat/mayz-gallery-v2
