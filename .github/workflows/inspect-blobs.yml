name: Inspect Pending Blobs
on:
  push:
    branches: [tmp/blob-inspect]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect chunks
        run: |
          for f in .blob-inspect/*; do printf '%s ' "$f"; wc -c < "$f" | tr '\n' ' '; xxd -l 8 -p "$f"; done
      - name: Stage valid WebP files
        run: |
          mkdir -p artifact
          cp .blob-inspect/{07..15}.webp artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: pending-gallery-webp
          path: artifact
